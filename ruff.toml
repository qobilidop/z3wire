# Google Python Style Guide: 4-space indent, 80-char line length.
line-length = 80
indent-width = 4

[format]
quote-style = "double"
indent-style = "space"

[lint]
select = [
  "B", # flake8-bugbear (common bugs, mutable default args)
  "BLE", # flake8-blind-except (no bare except)
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort (import sorting)
  "N", # pep8-naming
  "UP", # pyupgrade
  "W", # pycodestyle warnings
]

[lint.isort]
# Google style: future, stdlib, third-party, first-party.
known-first-party = ["z3wire"]
