site_name: Z3Wire
site_description: >-
  Z3 bit-vectors with compile-time type safety and explicit overflow.
  For C++20 and above.
repo_url: https://github.com/qobilidop/z3wire
repo_name: qobilidop/z3wire

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.follow

plugins:
  - include-markdown

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Usage:
      - Cheatsheet: usage/cheatsheet.md
      - Types: usage/types.md
      - Operations: usage/operations.md
      - Limitations: usage/limitations.md
  - Examples:
      - Safe Adder: examples/safe-adder.md
      - ALU Verification: examples/alu.md
      - Bit Manipulation: examples/bit-manipulation.md
  - Design:
      - Overview: design/overview.md
      - Compile-Fail Tests: design/compile-fail-tests.md
  - Development:
      - Test Coverage: dev/test-coverage.md
      - Roadmap: dev/roadmap.md
