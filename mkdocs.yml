site_name: Z3Wire
site_description: >-
  Z3 bit-vectors with compile-time width safety and overflow-proof arithmetic.
  A C++20 template library.
repo_url: https://github.com/qobilidop/z3wire
repo_name: qobilidop/z3wire

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.follow

plugins:
  - include-markdown

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Examples:
      - Safe adder: examples/safe-adder.md
      - ALU verification: examples/alu.md
      - Bit manipulation: examples/bit-manipulation.md
  - User guide:
      - Type system: user/types.md
      - Concrete types: user/concrete-types.md
      - Operations: user/operations.md
      - Casting: user/casting.md
      - Bit manipulation: user/bit-manipulation.md
      - Shifting: user/shifting.md
      - Limitations: user/limitations.md
  - Developer guide:
      - Design: dev/design.md
      - Roadmap: dev/roadmap.md
