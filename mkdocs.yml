site_name: Z3Wire
site_description: Compile-time safe bit-vectors for Z3.
repo_url: https://github.com/qobilidop/z3wire
repo_name: qobilidop/z3wire

theme:
  name: material
  favicon: assets/z3wire_logo.svg
  logo: assets/z3wire_logo.svg
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Examples: https://github.com/qobilidop/z3wire/tree/main/examples
  - Usage:
      - usage/index.md
      - Types: usage/types.md
      - Type Conversions: usage/type-conversions.md
      - Operations: usage/operations.md
  - Design:
      - design/index.md
      - Concrete Types: design/concrete-types.md
      - "Bool vs UInt<1>": design/bool-vs-uint1.md
      - Lossless Auto-Promotion: design/lossless-auto-promotion.md
      - Three-Tier Casting: design/three-tier-casting.md
      - Mathematical Comparison: design/mathematical-comparison.md
      - Bit-Growth Arithmetic: design/bit-growth-arithmetic.md
  - Development:
      - dev/index.md
      - North Star: dev/north_star.md
      - Roadmap: dev/roadmap.md
      - Architecture: dev/architecture.md
      - Setup: dev/setup.md
      - Commands: dev/commands.md
      - Style: dev/style.md
      - Workflow: dev/workflow.md
