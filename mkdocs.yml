site_name: Z3Wire
site_description: >-
  Z3 bit-vectors with compile-time width safety and overflow-proof arithmetic.
  A C++20 template library.
repo_url: https://github.com/qobilidop/z3wire
repo_name: qobilidop/z3wire

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Type System: guide/types.md
      - Operations: guide/operations.md
      - Casting: guide/casting.md
      - Bit Manipulation: guide/bit-manipulation.md
      - Shifting: guide/shifting.md
  - Examples:
      - Safe Adder: examples/safe-adder.md
      - ALU Verification: examples/alu.md
      - Bit Manipulation: examples/bit-manipulation.md
  - Design: design.md
