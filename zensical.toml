[project]
site_name = "Z3Wire"
site_description = "Compile-time safe bit-vectors for Z3."

repo_url = "https://github.com/qobilidop/z3wire"
repo_name = "qobilidop/z3wire"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Examples" = "https://github.com/qobilidop/z3wire/tree/main/examples" },
  { "Usage" = [
    "usage/index.md",
    { "Types" = "usage/types.md" },
    { "Type Conversions" = "usage/type-conversions.md" },
    { "Operations" = "usage/operations.md" },
  ] },
  { "Design" = [
    "design/index.md",
    { "Concrete Types" = "design/concrete-types.md" },
    { "Bool vs UInt<1>" = "design/bool-vs-uint1.md" },
    { "Lossless Auto-Promotion" = "design/lossless-auto-promotion.md" },
    { "Three-Tier Casting" = "design/three-tier-casting.md" },
    { "Mathematical Comparison" = "design/mathematical-comparison.md" },
    { "Bit-Growth Arithmetic" = "design/bit-growth-arithmetic.md" },
  ] },
  { "Development" = [
    "dev/index.md",
    { "North Star" = "dev/north_star.md" },
    { "Roadmap" = "dev/roadmap.md" },
    { "Architecture" = "dev/architecture.md" },
    { "Setup" = "dev/setup.md" },
    { "Commands" = "dev/commands.md" },
    { "Style" = "dev/style.md" },
    { "Workflow" = "dev/workflow.md" },
  ] },
]

[project.theme]
favicon = "assets/z3wire_logo.svg"
logo = "assets/z3wire_logo.svg"

features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.sections",
  "navigation.expand",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
