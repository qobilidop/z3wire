name: Bazel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore Bazel disk cache
        uses: actions/cache@v4
        with:
          path: .bazel-disk-cache
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.bazelrc') }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-

      - name: Build
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/qobilidop/z3wire-dev
          push: never
          runCmd: bazel build //...

      - name: Test
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/qobilidop/z3wire-dev
          push: never
          runCmd: bazel test //...

      - name: Coverage
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/qobilidop/z3wire-dev
          push: never
          runCmd: |
            ./tools/coverage.sh
            cp "$(bazel info output_path)/_coverage/_coverage_report.dat" coverage.lcov

      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
